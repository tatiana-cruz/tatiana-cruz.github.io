# "Where I come from": the Cataguases gallery on the homepage.
# Leave credit blank for your own photographs.
intro: >-
  I was born in Cataguases, Minas Gerais, Brazil, a city of about 66,000 people in the
  Zona da Mata. For a city of its size, it has an impressive array of modern architecture, including,
  including buildings by Oscar Niemeyer, Aldary Toledo, Francisco Bolonha and
  Edgar Guimarães do Vale.

photos:
